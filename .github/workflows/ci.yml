# CI командного проєкту. Один workflow — чотири jobs:
#   spec        — завжди: структура специфікацій (openspec validate --strict) + AC ID, унікальність, denylist;
#   app         — завжди: lint (0 warnings), typecheck (typegen + tsc), unit-тести, build;
#   conformance — у ФОРКУ розробника або в репозиторії зі змінною APP_REPO=true: спека збігається з тегом upstream (.spec-source) + покриття AC;
#   db          — лише push у main (форк або APP_REPO=true) і лише якщо задано секрети Supabase: supabase db push.
# В upstream PM (репозиторій із «Use this template», не форк, без APP_REPO) jobs conformance і db пропускаються. Звичайний клієнтський проєкт без форків: змінна репозиторію APP_REPO=true (Settings → Secrets and variables → Actions → Variables) вмикає їх; .spec-source лишається закоментованим.
# Назви jobs spec, app, conformance, db не змінюйте: на них тримаються ruleset-и (обов'язкові перевірки).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новий push у PR скасовує застарілий прогін; push у main — ні: черга, щоб не обірвати job db посеред db push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: OpenSpec validate --all --strict
        run: npm run spec:validate
      - name: AC IDs, uniqueness, denylist
        run: npm run spec:check
        env:
          # Необов'язковий секрет: справжні назви клієнтів через кому (у публічному репо — не у файлі).
          SPEC_DENYLIST: ${{ secrets.SPEC_DENYLIST }}

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  conformance:
    if: ${{ github.event.repository.fork || vars.APP_REPO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: product/ and openspec/specs match the upstream tag from .spec-source
        # До першого тегу (у форку ще немає openspec/specs/*/spec.md) .spec-source закоментований — крок
        # пропускається з попередженням; щойно спека у форку, порожній .spec-source або upstream = сам форк — FAIL.
        # Заповнюють його в гілці sync/spec-vX.Y разом із git merge тегу (README, кроки 6 і 8 розробника).
        # У репозиторії з APP_REPO=true (не форк) SPEC_SOURCE_IN_FORK=0: закоментований .spec-source — SKIP.
        run: npm run spec:source
        env:
          SPEC_SOURCE_IN_FORK: ${{ github.event.repository.fork && '1' || '0' }}
      - name: Every AC has a matrix row; every «реалізовано» has a test
        if: ${{ !cancelled() }}
        run: npm run ac:coverage

  db:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.event.repository.fork || vars.APP_REPO == 'true') }}
    needs: [spec, app, conformance]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      # secrets.* не можна використати в if на рівні job, тому перевіряємо їх кроком.
      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секрети SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID не задано — db push пропущено."
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v7
      # Без `version:` setup-cli@v3 бере версію supabase з package-lock.json (2.120.0).
      - if: steps.secrets.outputs.ok == 'true'
        uses: supabase/setup-cli@v3
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.secrets.outputs.ok == 'true'
        run: supabase db push
