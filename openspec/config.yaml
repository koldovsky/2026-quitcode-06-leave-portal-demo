schema: spec-driven

# Контекст і правила потрапляють у кожен запит агента (`openspec instructions <artifact> --json`).
# Тримайте їх короткими: довгі інструкції агент виконує гірше.
# УВАГА: кожен пункт rules — у лапках. Пункт із ": " без лапок YAML читає як словник,
# і OpenSpec мовчки (лише з попередженням) відкидає ВСІ правила цього артефакту.
context: |
  Language: Ukrainian
  All artifacts must be written in Ukrainian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Продукт: портал відсутностей персоналу школи — працівники (учителі й асистенти, 1–2 посади в різних підрозділах) подають заявки на відсутність, менеджери підрозділів ухвалюють рішення, адміністратор веде календар заблокованих днів; деталі в product/vision.md, терміни в product/glossary.md, ролі в product/roles.md.
  Стек (фіксований, у специфікаціях його не описуємо): Next.js 16 App Router, React 19, TypeScript, Tailwind 4, Supabase (Postgres + Auth + RLS), Vercel, Node 24.
  Конвенції: одна зміна OpenSpec — один намір; AC ID формату AC-<AREA>-<NN> на початку назви кожного сценарію; ті самі ID — у назвах тестів і в docs/conformance.md; дані в прикладах лише синтетичні (*@example.test).
  Ролі: PM в upstream пише proposal.md і дельти специфікацій (що і навіщо), тегує релізи spec-vX.Y; розробник у своєму форку пише design.md і tasks.md (як), product/ і openspec/specs не змінює — питання до спеки відкриває issue spec-question в upstream.

rules:
  proposal:
    - "Розділи proposal.md у такому порядку: ## Why, ## What Changes, ## Capabilities (з шаблону OpenSpec: ### New Capabilities і ### Modified Capabilities; для кожної можливості — свій specs/<capability>/spec.md), ## Users & roles, ## Non-goals, ## Assumptions, ## Open questions; ## Impact — необов'язково (де його ставить шаблон OpenSpec) і лише на рівні продукту (які ролі, процеси й інші можливості зачеплено), без коду й API."
    - "Why — проблема користувача й цінність зрізу (2–5 речень), без опису реалізації."
    - "What Changes — список змін поведінки; для кожної нової або зміненої вимоги вкажіть її AC ID."
    - "Users & roles — хто з ролей у product/roles.md що робить у цьому зрізі; права у вигляді таблиці роль × сутність × дія."
    - "Non-goals — те, що могло б бути метою, але свідомо виключено (не заперечення на кшталт «не падати»)."
    - "Assumptions — припущення, які PM зробив сам; Open questions — нумеровані питання Q1, Q2, … без відповіді."
    - "Не згадуйте таблиці, API, компоненти чи бібліотеки: це рішення розробника в design.md."
    - "Одна зміна — один намір, який можна сформулювати одним реченням."
  specs:
    - "Кожна вимога — одне речення EARS з англійським SHALL або MUST (WHEN …, the system SHALL …; IF …, THEN the system SHALL …; WHILE …, the system SHALL …)."
    - "Один сценарій = один критерій приймання (AC); назва сценарію починається з AC ID, наприклад '#### Scenario: AC-LEAVE-01 Подання заявки на один день'."
    - "AC ID має формат AC-<AREA>-<NN>: AREA — 2–12 великих латинських літер, NN — дві цифри; ID не змінюються й не використовуються повторно."
    - "Сценарії декларативні (бізнес-результат), із конкретними числами, датами й кодами помилок; без скриптів кліків по інтерфейсу."
    - "Сценарії містять лише - **WHEN**, - **THEN**, - **AND**; заголовок сценарію — рівно чотири решітки (####)."
    - "Жодних деталей реалізації: назв таблиць, ендпоінтів, компонентів, бібліотек."
    - "MODIFIED містить повністю скопійований блок вимоги з усіма сценаріями; перейменування — лише через RENAMED."
  design:
    - "Design пише розробник: таблиці, міграції (GRANT + RLS + політики), server actions, сторінки; кожне рішення посилається на AC ID."
  tasks:
    - "Задачі — вертикальні зрізи (UI + server action + таблиця/RLS + тест); кожна закінчується рядком 'Done when: AC-…'."
